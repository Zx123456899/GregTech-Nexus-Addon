# Temporary datagen workflow for the voltage-compression branch: regenerates the tracked
# src/generated resources and uploads them so the MainAgent can commit the fresh data.
# Safe to delete once the branch is merged.
name: Datagen Upload

on:
  push:
    branches: [ "voltage-compression" ]

jobs:
  datagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    - name: Run datagen
      run: ./gradlew runData
    - name: Upload generated resources
      uses: actions/upload-artifact@v4
      with:
        name: generated
        if-no-files-found: error
        path: src/generated
