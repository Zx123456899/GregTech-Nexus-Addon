# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and security
# documentation.

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "ci-jar-verify" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # ---- datagen MUST run before build ----
    # GTNA ships zero recipe JSON in git: src/generated/resources/data/gtna/ has only
    # loot_tables and tags. Every recipe is produced by GTNAGTAddon.addRecipes() during
    # runData, and `build` does NOT depend on `runData`. Building first therefore packs
    # a jar with no gtna recipes at all.
    - name: Run datagen (must precede build)
      run: ./gradlew runData

    - name: Assert recipes were generated
      run: |
        GEN=src/generated/resources/data/gtna/recipes
        echo "looking for generated recipes under: $GEN"
        if [ ! -d "$GEN" ]; then
          echo "::error::no generated recipes directory found at $GEN"
          echo "---- what runData actually produced ----"
          find src/generated/resources/data -maxdepth 2 -type d | sort
          exit 1
        fi
        COUNT=$(find "$GEN" -name '*.json' | wc -l)
        echo "generated recipe json count: $COUNT"
        if [ "$COUNT" -eq 0 ]; then
          echo "::error::datagen produced 0 recipe files"
          exit 1
        fi
        echo "---- sample recipe files ----"
        find "$GEN" -name '*.json' | head -20 | sort

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Assert the jar actually contains recipes
      run: |
        echo "==== jars produced ===="
        ls -la build/libs/ || true
        FAIL=0
        for J in build/libs/*.jar; do
          [ -e "$J" ] || continue
          case "$J" in *sources*|*javadoc*) continue;; esac
          N=$(unzip -l "$J" | grep -cE 'data/gtna/recipes/.*\.json' || true)
          echo "$J -> gtna recipe entries: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::$J contains no gtna recipes"
            FAIL=1
          fi
        done
        if [ "$FAIL" -ne 0 ]; then
          echo "==== top-level data/ layout inside jar ===="
          for J in build/libs/*.jar; do
            [ -e "$J" ] || continue
            echo "--- $J ---"
            unzip -l "$J" | grep -E '^\s+[0-9]+.*data/' | awk '{print $4}' | sed -E 's#(data/[^/]+/[^/]+).*#\1#' | sort -u | head -20
          done
          exit 1
        fi
        echo "jar recipe assertion passed"

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: gtna-jar
        path: build/libs/*.jar
        if-no-files-found: error

    - name: Code quality (spotless) + unit tests
      run: ./gradlew spotlessCheck runUnitTests

    # Generated resources are tracked; if datagen produces a diff the committed en_us/assets are stale.
    - name: Data generation is deterministic
      run: |
        ./gradlew runData
        if ! git diff --quiet -- src/generated; then
          echo "::error::runData changed generated resources; run ./gradlew runData and commit the result"
          git --no-pager diff --stat -- src/generated
          exit 1
        fi
        echo "datagen is deterministic"

    # runGameTestServer exits 0 even when the mod fails to load, so the log banner is the real
    # assertion. Without this guard a broken build passes silently.
    - name: Game tests
      run: |
        # run/ is gitignored, so CI has to accept the EULA the dedicated server asks for.
        mkdir -p run
        echo "eula=true" > run/eula.txt
        ./gradlew runGameTestServer

    - name: Verify GameTest results and JUnit report
      run: python3 tools/check_gametest_report.py

    - name: Upload GameTest diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gametest-results
        if-no-files-found: warn
        path: |
          build/test-results/gametest/TEST-gtna.xml
          run/logs/latest.log
