# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "ci-jar-verify", "zpm-compression-0.5.2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # NOTE: GTNA recipes are registered at RUNTIME by GTCEu via IGTAddon.addRecipes(),
    # not by datagen. `runData` only produces blockstates/models/lang/loot_tables/tags,
    # so `build` alone already yields a fully functional jar. The recipe coverage is
    # asserted by the GameTest step below (GTNAMachineGameTests reads the live
    # RecipeManager and requires >= 700 integrated ore recipes).
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Sanity-check the produced jar
      run: |
        echo "==== jars produced ===="
        ls -la build/libs/
        FAIL=0
        for J in build/libs/*.jar; do
          [ -e "$J" ] || continue
          case "$J" in *sources*|*javadoc*) continue;; esac
          SIZE=$(stat -c%s "$J")
          MODS=$(unzip -l "$J" | grep -c 'META-INF/mods.toml' || true)
          ADDON=$(unzip -l "$J" | grep -c 'GTNAGTAddon.class' || true)
          echo "$J | ${SIZE} bytes | mods.toml=$MODS | GTNAGTAddon.class=$ADDON"
          if [ "$SIZE" -lt 200000 ] || [ "$MODS" -eq 0 ] || [ "$ADDON" -eq 0 ]; then
            echo "::error::$J looks incomplete"; FAIL=1
          fi
        done
        [ "$FAIL" -eq 0 ] && echo "jar sanity check passed" || exit 1

    - name: Upload mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: gtna-jar
        path: build/libs/*.jar
        if-no-files-found: error

    - name: Code quality (spotless) + unit tests
      run: ./gradlew spotlessCheck runUnitTests

    # Generated resources are tracked; if datagen produces a diff the committed en_us/assets are stale.
    - name: Data generation is deterministic
      run: |
        ./gradlew runData
        if ! git diff --quiet -- src/generated; then
          echo "::error::runData changed generated resources; run ./gradlew runData and commit the result"
          git --no-pager diff --stat -- src/generated
          exit 1
        fi
        echo "datagen is deterministic"

    # runGameTestServer exits 0 even when the mod fails to load, so the log banner is the real
    # assertion. Without this guard a broken build passes silently.
    - name: Game tests
      run: |
        # run/ is gitignored, so CI has to accept the EULA the dedicated server asks for.
        mkdir -p run
        echo "eula=true" > run/eula.txt
        ./gradlew runGameTestServer

    - name: Verify GameTest results and JUnit report
      run: python3 tools/check_gametest_report.py

    - name: Upload GameTest diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gametest-results
        if-no-files-found: warn
        path: |
          build/test-results/gametest/TEST-gtna.xml
          run/logs/latest.log
